services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidha-mlp:latest
    container_name: vidha-train
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VIDHA_ROOT: /app
      VIDHA_DATA_DIR: /app/data
      VIDHA_PLOTS_DIR: /app/plots
      VIDHA_MODELS_DIR: /app/models
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./plots:/app/plots
      - ./models:/app/models
