[project]
name = "vidha"
version = "0.1.0"
description = "NumPy-from-scratch MLP on Fashion-MNIST with matplotlib plots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
vidha = "vidha:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
